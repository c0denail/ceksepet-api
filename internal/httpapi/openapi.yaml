components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Kayıt veya login SMS doğrulamasından dönen opaque access token
    operatorBearerAuth:
      type: http
      scheme: bearer
      description: Operatör login endpointinden dönen süreli opaque operatör tokenı
  responses:
    BadRequest:
      description: Geçersiz alan, OTP veya süresi dolmuş geçici oturum
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Akış adımı veya benzersiz alan çakışması
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Telefon/PIN veya access token geçersiz
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: SMS yeniden gönderme veya OTP deneme limiti
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OTPDeliveryFailed:
      description: SMS sağlayıcısı kodu gönderemedi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Servis hazır değil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - PHONE_ALREADY_REGISTERED
          - INVALID_CREDENTIALS
          - REGISTRATION_SESSION_EXPIRED
          - LOGIN_SESSION_EXPIRED
          - INVALID_REGISTRATION_STEP
          - OTP_INVALID
          - OTP_EXPIRED
          - OTP_ATTEMPTS_EXCEEDED
          - OTP_RATE_LIMITED
          - PIN_RATE_LIMITED
          - OTP_DELIVERY_FAILED
          - REGISTRATION_CONFLICT
          - UNAUTHORIZED
          - INVALID_OPERATOR_CREDENTIALS
          - OPERATOR_RATE_LIMITED
          - OPERATOR_DISABLED
          - USER_NOT_FOUND
          - SERVICE_UNAVAILABLE
          - INTERNAL_ERROR
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        retryAfter:
          type: integer
          minimum: 1
    RegisterStep1Request:
      type: object
      additionalProperties: false
      required:
      - firstName
      - lastName
      - phone
      - pin
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          description: E.164 veya Türkiye yerel formatı
          example: '+905551112233'
        pin:
          type: string
          pattern: ^[0-9]{6}$
          example: '123456'
    RegisterStep1Response:
      type: object
      required:
      - registrationToken
      - currentStep
      - expiresAt
      properties:
        registrationToken:
          type: string
          description: Mobil uygulamada kalıcı depoya yazılmamalıdır.
        currentStep:
          type: integer
          enum:
          - 2
        expiresAt:
          type: string
          format: date-time
    RegisterStep2Request:
      type: object
      additionalProperties: false
      required:
      - registrationToken
      - avatarId
      properties:
        registrationToken:
          type: string
        avatarId:
          type: string
          enum:
          - avatar_01
          - avatar_02
          - avatar_03
          - avatar_04
          - avatar_05
          - avatar_06
          - avatar_07
          - avatar_08
    RegisterStep2Response:
      allOf:
      - $ref: '#/components/schemas/OtpSentResponse'
      - type: object
        required:
        - registrationToken
        - currentStep
        - username
        - avatarId
        - avatarUrl
        properties:
          registrationToken:
            type: string
          currentStep:
            type: integer
            enum:
            - 3
          username:
            type: string
            pattern: ^[a-z0-9_]+@[0-9]{5}$
            example: burak_yilmaz@12345
          avatarId:
            type: string
          avatarUrl:
            type: string
            format: uri
    RegistrationTokenRequest:
      type: object
      additionalProperties: false
      required:
      - registrationToken
      properties:
        registrationToken:
          type: string
    VerifyRegistrationOtpRequest:
      type: object
      additionalProperties: false
      required:
      - registrationToken
      - otpCode
      properties:
        registrationToken:
          type: string
        otpCode:
          type: string
          pattern: ^[0-9]{6}$
          example: '123456'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      - pin
      properties:
        phone:
          type: string
          example: '+905551112233'
        pin:
          type: string
          pattern: ^[0-9]{6}$
          example: '123456'
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - pin
      properties:
        username:
          type: string
          example: burak_yilmaz@12345
        pin:
          type: string
          pattern: ^[0-9]{6}$
          description: Kullanıcının mevcut 6 haneli PIN'i
          example: '123456'
    OperatorLoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: operator
        password:
          type: string
          format: password
          description: OPERATOR_PASSWORD ortam değişkenindeki parola
    OperatorAuthResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresAt
      - username
      properties:
        accessToken:
          type: string
          description: Yalnızca özeti Atlas'ta saklanan operatör Bearer tokenı
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        username:
          type: string
    LoginStartedResponse:
      allOf:
      - $ref: '#/components/schemas/OtpSentResponse'
      - type: object
        required:
        - loginToken
        - expiresAt
        properties:
          loginToken:
            type: string
          expiresAt:
            type: string
            format: date-time
    LoginTokenRequest:
      type: object
      additionalProperties: false
      required:
      - loginToken
      properties:
        loginToken:
          type: string
    VerifyLoginOtpRequest:
      type: object
      additionalProperties: false
      required:
      - loginToken
      - otpCode
      properties:
        loginToken:
          type: string
        otpCode:
          type: string
          pattern: ^[0-9]{6}$
          example: '123456'
    OtpSentResponse:
      type: object
      required:
      - otpSent
      - maskedPhone
      - otpExpiresIn
      - retryAfter
      properties:
        otpSent:
          type: boolean
          enum:
          - true
        maskedPhone:
          type: string
        otpExpiresIn:
          type: integer
          example: 240
        retryAfter:
          type: integer
          example: 60
        debugOtpCode:
          type: string
          pattern: ^[0-9]{6}$
          description: Yalnızca development/test ortamında döner.
    AuthResponse:
      type: object
      required:
      - user
      - accessToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: Logout veya hesap silme işlemine kadar geçerli opaque bearer token
    User:
      type: object
      required:
      - id
      - firstName
      - lastName
      - phone
      - username
      - avatarId
      - avatarUrl
      - createdAt
      - displayName
      - ticketBalance
      properties:
        displayName:
          type: string
          example: Hakan Özyurt
        ticketBalance:
          type: integer
          format: int64
          minimum: 0
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        username:
          type: string
        avatarId:
          type: string
        avatarUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    PublicUser:
