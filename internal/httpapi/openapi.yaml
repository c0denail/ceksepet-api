openapi: 3.0.3
info:
  title: ÇekSepet Mobile API
  version: 3.1.0
  description: 'ÇekSepet mobil uygulamasının telefon + 6 haneli PIN + çift aşamalı SMS OTP akışı.


    Kayıt sırası:

    1. Kişisel bilgiler ve PIN ile geçici `registrationToken` alınır.

    2. Avatar seçilir; kullanıcı adı sunucuda `ad_soyad@12345` biçiminde üretilir ve SMS gönderilir.

    3. Kayıt SMS kodu doğrulanır; kullanıcı kalıcılaştırılır ve access token üretilir.


    Giriş sırası:

    1. Telefon ve PIN doğrulanır; SMS gönderilir ve geçici `loginToken` alınır.

    2. Giriş SMS kodu doğrulanır; access token üretilir.


    Access token süre dolumuna sahip değildir, uygulama kapanınca geçerliliğini korur ve

    logout veya hesap silme ile sunucuda iptal edilir. Development/test ortamında Swagger akışını deneyebilmek için

    SMS cevaplarında `debugOtpCode` bulunur; production ortamında bu alan dönmez.


    Ürün/çekiliş, fotoğraf, favori, cüzdan, onaylı katılım, soru-cevap, değerlendirme ve bildirim API’leri. Para
    birimi kuruş, bilet sayısı tam sayıdır. Katılım ve bilet yükleme Idempotency-Key gerektirir.

    '
servers:
- url: http://localhost:8080
  description: Yerel geliştirme
tags:
- name: Registration
  description: Üç ekranlı mobil kayıt akışı
- name: Login
  description: Telefon/PIN ve SMS OTP ile giriş
- name: Session
- name: Account
- name: Users
  description: Kimlik doğrulaması istemeyen sınırlı public profil dizini
- name: Operator
  description: Ayrı operatör tokenıyla test ve yönetim işlemleri
- name: Avatars
- name: System
- name: Catalog
- name: Raffles
- name: Photos
- name: Wallet
- name: Community
- name: Notifications
- name: Profile
- name: Reports
paths:
  /health/live:
    get:
      tags:
      - System
      summary: Süreç canlılık kontrolü
      operationId: live
      responses:
        '200':
          description: Servis çalışıyor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - System
      summary: Veritabanı hazır olma kontrolü
      operationId: ready
      responses:
        '200':
          description: Servis hazır
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/avatars:
    get:
      tags:
      - Avatars
      summary: Seçilebilir avatar kataloğunu getir
      operationId: listAvatars
      responses:
        '200':
          description: Avatarlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCatalogResponse'
  /avatars/{filename}:
    get:
      tags:
      - Avatars
      summary: Avatar SVG görselini getir
      operationId: getAvatarImage
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
        example: avatar_01.svg
      responses:
        '200':
          description: SVG avatar
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          description: Avatar bulunamadı
  /api/v1/auth/register/step-1:
    post:
      tags:
      - Registration
      summary: Kişisel bilgileri ve 6 haneli PIN'i al
      description: Henüz kullanıcı oluşturmaz. Uygulama belleğinde tutulacak kısa ömürlü kayıt tokenı üretir.
      operationId: registerStep1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStep1Request'
            example:
              firstName: Burak
              lastName: Yılmaz
              phone: '+905551112233'
              pin: '123456'
      responses:
        '200':
          description: Geçici kayıt oturumu açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterStep1Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Telefon zaten kayıtlı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/register/step-2:
    post:
      tags:
      - Registration
      summary: Avatarı seç, kullanıcı adını üret ve kayıt SMS kodunu gönder
      operationId: registerStep2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStep2Request'
      responses:
        '200':
          description: Profil hazırlandı ve SMS gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterStep2Response'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/OTPDeliveryFailed'
  /api/v1/auth/register/otp/verify:
    post:
      tags:
      - Registration
      summary: Kayıt SMS kodunu doğrula ve kullanıcıyı oluştur
      operationId: verifyRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationOtpRequest'
      responses:
        '200':
          description: Kayıt tamamlandı ve access token üretildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/register/otp/resend:
    post:
      tags:
      - Registration
      summary: Kayıt SMS kodunu yeniden gönder
      operationId: resendRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationTokenRequest'
      responses:
        '200':
          description: Yeni SMS kodu gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/OTPDeliveryFailed'
  /api/v1/auth/login:
    post:
      tags:
      - Login
      summary: Telefon ve PIN'i doğrula, giriş SMS kodunu gönder
      description: Bu endpoint access token üretmez. Önce SMS kodu doğrulanmalıdır.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+905551112233'
              pin: '123456'
      responses:
        '200':
          description: PIN doğru; giriş SMS kodu gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStartedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/OTPDeliveryFailed'
  /api/v1/auth/login/otp/verify:
    post:
      tags:
      - Login
      summary: Giriş SMS kodunu doğrula ve access token üret
      operationId: verifyLoginOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyLoginOtpRequest'
      responses:
        '200':
          description: Giriş onaylandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login/otp/resend:
    post:
      tags:
      - Login
      summary: Giriş SMS kodunu yeniden gönder
      operationId: resendLoginOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginTokenRequest'
      responses:
        '200':
          description: Yeni SMS kodu gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/OTPDeliveryFailed'
  /api/v1/auth/logout:
    post:
      tags:
      - Session
      summary: Aktif access tokenı sunucuda iptal et
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Token iptal edildi
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/operator/login:
    post:
      tags:
      - Operator
      summary: Operatör girişi yap ve süreli operatör tokenı al
      operationId: operatorLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorLoginRequest'
            example:
              username: operator
              password: operator-password-from-env
      responses:
        '200':
          description: Operatör oturumu oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Operatör girişi yapılandırmada etkin değil
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/operator/logout:
    post:
      tags:
      - Operator
      summary: Aktif operatör tokenını iptal et
      operationId: operatorLogout
      security:
      - operatorBearerAuth: []
      responses:
        '204':
          description: Operatör tokenı iptal edildi
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/operator/users:
    get:
      tags:
      - Operator
      summary: Operatör için müşteri listesini getir
      description: Public listeden farklı olarak telefon alanını da döndürür.
      operationId: operatorListUsers
      security:
      - operatorBearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      responses:
        '200':
          description: Sayfalanmış müşteri listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorUserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/operator/users/{userId}:
    delete:
      tags:
      - Operator
      summary: Müşteriyi ve ilişkili tüm oturumlarını kalıcı olarak sil
      operationId: operatorDeleteUser
      security:
      - operatorBearerAuth: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Müşteri silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Müşteri bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Aktif/tamamlanmış satış veya bilet kaydı olan hesap kapatma desteği gerektirir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Public kullanıcı profil listesini getir
      description: Telefon, PIN özeti ve oturum bilgileri dönmez. Bearer token gerekmez.
      operationId: listUsers
      security: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Sayfadaki en fazla kullanıcı sayısı
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        description: Atlanacak kullanıcı sayısı
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      responses:
        '200':
          description: En yeni kullanıcıdan eskiye sayfalanmış public profil listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/users/me:
    get:
      tags:
      - Session
      summary: Giriş yapan kullanıcıyı getir
      operationId: me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Kullanıcı profili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Account
      summary: Giriş yapan kullanıcının hesabını kalıcı olarak sil
      description: 'Bearer token ile giriş yapan kullanıcının kendi kullanıcı adı ve 6 haneli PIN''i

        yeniden doğrulanır. Kullanıcı ve ilişkili oturumlar MongoDB transaction''ı içinde silinir.

        '
      operationId: deleteAccount
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              username: burak_yilmaz@12345
              pin: '123456'
      responses:
        '204':
          description: Hesap ve kullanıcıya ait sunucu oturumları silindi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: Aktif/tamamlanmış satış veya bilet kaydı olan hesap kapatma desteği gerektirir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/catalog:
    get:
      tags:
      - Catalog
      summary: Kategori, marka, sıralama ve ürün ekleme kuralları
      operationId: getCatalog
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security: []
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
  /api/v1/content/{slug}:
    get:
      tags:
      - Catalog
      summary: Ekran bilgilendirme metni
      operationId: getHelpContent
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpContent'
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: 'slug: bag-raffle, raffle-safety veya selling. Ekrandaki örnek metinler yerine düzenlenebilir
        Türkçe başlangıç içerikleri.'
      security: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  /api/v1/raffles/quote:
    post:
      tags:
      - Raffles
      summary: Fiyat, kazanç, komisyon ve toplam bilet hesabı
      operationId: quoteRaffle
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: Fiyat kuruş cinsindedir. Kazanç = ceil(fiyat / bilet değeri); komisyon = ceil(kazanç × commissionBps
        / 10000). Toplam = kazanç + komisyon. Sunucu ürün oluşturulurken tekrar hesaplar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceQuoteRequest'
  /api/v1/photos:
    post:
      tags:
      - Photos
      summary: Ürün fotoğrafı yükle
      operationId: uploadPhoto
      responses:
        '201':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUpload'
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      description: file alanında tek JPEG/PNG. En fazla 5 MiB, her kenar en fazla 8000 px ve toplam en fazla 20
        megapiksel. Onay öncesi yalnızca sahibi ve operatör görebilir. Fotoğraflar MongoDB’de saklanır.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
  /api/v1/photos/{photoId}:
    get:
      tags:
      - Photos
      summary: Fotoğrafı görüntüle
      operationId: getPhoto
      responses:
        '200':
          description: Başarılı
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - {}
      - bearerAuth: []
      - operatorBearerAuth: []
      parameters:
      - name: photoId
        in: path
        required: true
        schema:
          type: string
  /api/v1/raffles:
    get:
      tags:
      - Raffles
      summary: Anasayfa çekiliş kartları
      operationId: listRaffles
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RafflePage'
        '400':
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Geçersiz veya eksik token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Yetki yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Kayıt bulunamadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Yetersiz bakiye, kapasite, durum veya idempotency çakışması
          content:
            application/json:
              schema:
