        totalTickets:
          type: integer
          format: int64
          example: 2580
      required:
      - priceKurus
      - ticketValueKurus
      - commissionBps
      - sellerTickets
      - commissionTickets
      - totalTickets
    PriceQuoteRequest:
      type: object
      properties:
        priceKurus:
          type: integer
          format: int64
